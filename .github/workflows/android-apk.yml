name: Build Candle OS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find project folder
        run: |
          DIR=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/android/*' | head -1)")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          ls -la "$DIR" "$DIR/android" || true
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund
      - name: Sync Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: candle-os-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
